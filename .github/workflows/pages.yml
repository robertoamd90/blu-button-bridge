name: Deploy installer site

on:
  release:
    types:
      - published

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare Pages payload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ github.event.release.tag_name }}"
          BOARD_CATALOG="config/boards.json"
          RELEASE_JSON="$(gh api "repos/${{ github.repository }}/releases/tags/${TAG}")"
          printf '%s' "$RELEASE_JSON" | jq -e --argfile boards "$BOARD_CATALOG" '
            . as $release
            | all(
                $boards.boards[];
                . as $board
                | any(
                    $release.assets[];
                    .name == $board.full_asset_name and .digest and .browser_download_url
                  )
              )
          ' >/dev/null

          rm -rf _site
          mkdir -p _site/firmware
          cp -R site/. _site/
          cp "$BOARD_CATALOG" _site/boards.json
          while IFS= read -r asset_name; do
            gh release download \
              "$TAG" \
              --repo "${{ github.repository }}" \
              --pattern "$asset_name" \
              --dir _site/firmware
          done < <(jq -r '.boards[].full_asset_name' "$BOARD_CATALOG")

          printf '%s' "$RELEASE_JSON" | jq -c --argfile boards "$BOARD_CATALOG" '
            . as $release
            | {
                tag: $release.tag_name,
                published_at: $release.published_at,
                html_url: $release.html_url,
                assets: (
                  $boards.boards
                  | map({
                      key: .id,
                      value: (
                        . as $board
                        | (
                            $release.assets[]
                            | select(.name == $board.full_asset_name)
                            | {
                                asset_name: .name,
                                asset_size: .size,
                                asset_sha256: .digest,
                                browser_download_url: .browser_download_url
                              }
                          )
                      )
                    })
                  | from_entries
                )
              }
          ' > _site/firmware/metadata.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
